server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: /posts/3, /dashboard etc. must fall back to index.html
    # so React Router can handle them on hard refresh and deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
