name: blog-deploy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: blogdb
      POSTGRES_USER: bloguser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloguser -d blogdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  blog-api:
    build: ../Blog.Api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=blogdb;Username=bloguser;Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env — generate with openssl rand -base64 48}
      Jwt__Issuer: blog-api
      Jwt__Audience: blog-client
      Cors__AllowedOrigins: "https://blog.${DOMAIN:?set DOMAIN in .env}"
      AdminUser__Email: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      AdminUser__Password: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  blog-client:
    build:
      context: ../blog-client
      args:
        VITE_API_URL: "https://api.blog.${DOMAIN}"
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      - blog-api
      - blog-client

volumes:
  pgdata:
