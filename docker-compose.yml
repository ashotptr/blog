name: blog

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: blogdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blogdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./Blog.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=blogdb;Username=postgres;Password=postgres"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Key: "local-compose-signing-key-do-not-use-in-production-0123456789"
      Jwt__Issuer: blog-api
      Jwt__Audience: blog-client
      Cors__AllowedOrigins: "http://localhost:8080"
      AdminUser__Email: "admin@localhost.dev"
      AdminUser__Password: "Admin!Dev123"
    ports:
      - "5028:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    build:
      context: ./blog-client
      args:
        VITE_API_URL: "http://localhost:5028"
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
